name: Publish release

# Publishes downloadable executables on a GitHub Release. Unlike Actions
# artifacts — which require a signed-in GitHub account and expire after 90
# days — release assets are downloadable by anyone, forever.
#
# To cut a release, push a version tag:
#     git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.0)"
        required: true

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install pinned dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary :all: -r requirements.lock

      - name: Install build tooling
        run: pip install "pyinstaller>=6.3"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_document.py
          python tests/test_textengine.py
          python tests/test_features.py
          python tests/test_gui.py

      - name: Build executable
        run: pyinstaller --noconfirm pdfstudio.spec

      # Zipped with Python so the same step works on all three runners without
      # depending on zip/7z/Compress-Archive being present.
      - name: Package
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          label, tag = os.environ["LABEL"], os.environ["REF_NAME"]
          dist = pathlib.Path("dist")
          binaries = [p for p in dist.iterdir() if p.is_file() and p.name.startswith("PDFStudio")]
          assert binaries, f"no executable produced in {list(dist.iterdir())}"
          out = pathlib.Path(f"PDFStudio-{tag}-{label}.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for b in binaries:
                  z.write(b, b.name)
              z.write("README.md", "README.md")
              z.write("LICENSE", "LICENSE")
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path(f"{out.name}.sha256").write_text(f"{digest}  {out.name}\n")
          print(f"{out.name}  {out.stat().st_size/1_048_576:.1f} MB  sha256={digest}")
          PY

      - name: Upload for the release job
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.label }}
          path: |
            PDFStudio-*.zip
            PDFStudio-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect every platform's package
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release

      - name: Assemble checksums
        run: |
          cd release
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          echo "--- release contents ---"
          ls -lh
          cat SHA256SUMS.txt

      # gh is preinstalled on GitHub runners, so this needs no third-party
      # action — one less dependency in the release path.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          Pick your platform, unzip, and run. No installer, no Python, no
          internet connection required — everything is inside the executable.

          | Platform | File | What to run |
          |---|---|---|
          | Windows | `PDFStudio-…-Windows.zip` | `PDFStudio.exe` |
          | macOS | `PDFStudio-…-macOS.zip` | `PDFStudio` |
          | Linux | `PDFStudio-…-Linux.zip` | `PDFStudio` |

          **Windows** shows a SmartScreen warning the first time because the app
          is not code-signed: choose **More info → Run anyway**.

          **macOS** may refuse to open an unsigned app: right-click it, choose
          **Open**, then confirm.

          `SHA256SUMS.txt` lets you verify a download matches what this build
          produced.

          ## What it does

          A free PDF editor with genuine inline text editing — click into any
          text, get a caret, and type. Edited text is written back in the
          document's own font, embedded fonts included. Also: drag text blocks,
          annotate, highlight, redact, reorder pages, merge, watermark and
          password-protect.

          See the README for the full feature list, and SECURITY.md for
          deployment notes.
          NOTES
          gh release create "$TAG" release/* \
            --title "PDF Studio $TAG" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
