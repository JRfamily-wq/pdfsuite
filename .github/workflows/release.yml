name: Publish release

# Publishes downloadable executables on a GitHub Release. Unlike Actions
# artifacts — which require a signed-in GitHub account and expire after 90
# days — release assets are downloadable by anyone, forever.
#
# To cut a release, push a version tag:
#     git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.0.0)"
        required: true

permissions:
  contents: write        # required to create the release and upload assets

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    env:
      # Optional code-signing material. When these secrets are absent the
      # signing steps are skipped and the release ships unsigned, exactly as
      # before — adding the secrets is all it takes to ship signed builds.
      WIN_SIGN_CERT_B64: ${{ secrets.WIN_SIGN_CERT_B64 }}
      WIN_SIGN_CERT_PASSWORD: ${{ secrets.WIN_SIGN_CERT_PASSWORD }}
      MAC_SIGN_CERT_B64: ${{ secrets.MAC_SIGN_CERT_B64 }}
      MAC_SIGN_CERT_PASSWORD: ${{ secrets.MAC_SIGN_CERT_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install pinned dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary :all: -r requirements.lock

      - name: Install build tooling
        run: pip install "pyinstaller>=6.3"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_document.py
          python tests/test_textengine.py
          python tests/test_features.py
          python tests/test_compress.py
          python tests/test_packaging.py
          python tests/test_gui.py

      # The committed assets/ icons are used as-is: regenerating per-OS would
      # give each platform a marginally different render (font fallback moves
      # the pixels), while the committed files are pixel-identical everywhere.
      # Update them deliberately with `python tools/make_icon.py`.
      - name: Build executable
        run: pyinstaller --noconfirm pdfstudio.spec

      - name: Sign the Windows executable (runs only when a certificate is configured)
        if: runner.os == 'Windows' && env.WIN_SIGN_CERT_B64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_SIGN_CERT_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on the runner" }
          & $signtool.FullName sign /f $pfx /p $env:WIN_SIGN_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /d "PDF Studio" dist\PDFStudio.exe
          & $signtool.FullName verify /pa dist\PDFStudio.exe
          Remove-Item $pfx

      - name: Sign the macOS app (runs only when a certificate is configured)
        if: runner.os == 'macOS' && env.MAC_SIGN_CERT_B64 != ''
        run: |
          P12="$RUNNER_TEMP/signing.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MAC_SIGN_CERT_B64" | base64 --decode > "$P12"
          security create-keychain -p tempkeychain "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p tempkeychain "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MAC_SIGN_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k tempkeychain "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          codesign --force --deep --options runtime --timestamp \
            --sign "$MAC_SIGN_IDENTITY" dist/PDFStudio.app
          codesign --verify --deep --verbose=2 dist/PDFStudio.app
          rm -f "$P12"
          # Notarization (xcrun notarytool) still needs an App Store Connect
          # API key and is documented in SECURITY.md as a manual follow-up.

      # Zipped with Python so the same step works on all three runners without
      # depending on zip/7z/Compress-Archive being present.
      - name: Package
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          OUT="PDFStudio-$REF_NAME-$LABEL.zip"
          if [ "$LABEL" = "macOS" ]; then
            # Ship the double-clickable .app. zip -ry keeps symlinks and the
            # executable bits — Python's zipfile would strip the bundle's
            # structure and macOS would refuse to launch it.
            test -d dist/PDFStudio.app
            STAGE="$(mktemp -d)"
            cp -R dist/PDFStudio.app "$STAGE/"
            cp README.md LICENSE "$STAGE/"
            (cd "$STAGE" && zip -qry "$OLDPWD/$OUT" .)
            rm -rf "$STAGE"
            shasum -a 256 "$OUT" | tee "$OUT.sha256"
          else
            python - <<'PY'
          import hashlib, os, pathlib, zipfile
          label, tag = os.environ["LABEL"], os.environ["REF_NAME"]
          dist = pathlib.Path("dist")
          binaries = [p for p in dist.iterdir() if p.is_file() and p.name.startswith("PDFStudio")]
          assert binaries, f"no executable produced in {list(dist.iterdir())}"
          out = pathlib.Path(f"PDFStudio-{tag}-{label}.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for b in binaries:
                  z.write(b, b.name)
              z.write("README.md", "README.md")
              z.write("LICENSE", "LICENSE")
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path(f"{out.name}.sha256").write_text(f"{digest}  {out.name}\n")
          print(f"{out.name}  {out.stat().st_size/1_048_576:.1f} MB  sha256={digest}")
          PY
          fi

      - name: Upload for the release job
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.label }}
          path: |
            PDFStudio-*.zip
            PDFStudio-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect every platform's package
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release

      - name: Assemble checksums
        run: |
          cd release
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          echo "--- release contents ---"
          ls -lh
          cat SHA256SUMS.txt

      # gh is preinstalled on GitHub runners, so this needs no third-party
      # action — one less dependency in the release path.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          Pick your platform, unzip, and run. No installer, no Python, no
          internet connection required — everything is inside the executable.

          | Platform | File | What to run |
          |---|---|---|
          | Windows | `PDFStudio-…-Windows.zip` | `PDFStudio.exe` |
          | macOS | `PDFStudio-…-macOS.zip` | `PDFStudio` |
          | Linux | `PDFStudio-…-Linux.zip` | `PDFStudio` |

          If this build is unsigned, **Windows** shows a SmartScreen warning on
          first run — choose **More info → Run anyway** — and **macOS** may
          refuse to open the app until you right-click it, choose **Open**, and
          confirm. (Builds are signed automatically when a code-signing
          certificate is configured in the repository.)

          `SHA256SUMS.txt` lets you verify a download matches what this build
          produced.

          ## What it does

          A free PDF editor with genuine inline text editing — click into any
          text, get a caret, and type. Edited text is written back in the
          document's own font, embedded fonts included. Also: drag text blocks,
          annotate, highlight, redact, reorder pages, merge, watermark and
          password-protect.

          See the README for the full feature list, and SECURITY.md for
          deployment notes.
          NOTES
          gh release create "$TAG" release/* \
            --title "PDF Studio $TAG" \
            --notes-file notes.md \
            --repo "$GITHUB_REPOSITORY"
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
