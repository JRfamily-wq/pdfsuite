name: Build PDF Studio executables

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # Every dependency is pinned to an exact version and SHA-256. If any file
      # differs by a byte from requirements.lock this step fails, so a hijacked
      # package cannot be baked into the executable. --only-binary stops pip
      # falling back to a source build (which would fetch MuPDF at build time).
      - name: Install pinned dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --only-binary :all: -r requirements.lock

      - name: Install build tooling
        run: pip install "pyinstaller>=6.3"

      - name: Run document engine tests
        run: python tests/test_document.py

      - name: Run text engine tests
        run: python tests/test_textengine.py

      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_gui.py

      - name: Build executable
        run: pyinstaller --noconfirm pdfstudio.spec

      - name: Checksum the executable
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum PDFStudio* | tee SHA256SUMS.txt
          else
            shasum -a 256 PDFStudio* | tee SHA256SUMS.txt
          fi

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PDFStudio-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pip-audit checks the pinned versions against the Python Advisory
      # Database. It runs in its own job so its own dependencies never touch
      # the environment the shipped executable is built from.
      - name: Audit pinned dependencies for known CVEs
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit --requirement requirements.lock --disable-pip --strict
